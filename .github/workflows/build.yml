name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller Directly
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Download and Extract Google Fastboot Binaries
      shell: cmd
      run: |
        :: 1. Download from a clean, direct automated download pipeline link
        curl -L "https://github.com" -o tools.zip
        
        :: 2. Extract using native Windows tar
        tar -xf tools.zip
        
        :: 3. Find and copy the files out of the extracted folders into the root directory
        for /r %%i in (fastboot.exe) do copy "%%i" .\fastboot.exe
        for /r %%i in (AdbWinApi.dll) do copy "%%i" .\AdbWinApi.dll

    - name: Compile Script to EXE via PyInstaller
      run: |
        pyinstaller --onefile --add-data "fastboot.exe;." --add-data "AdbWinApi.dll;." main.py

    - name: Upload Finished EXE Application
      uses: actions/upload-artifact@v4
      with:
        name: Fastboot-FRP-Utility
        path: dist/main.exe
