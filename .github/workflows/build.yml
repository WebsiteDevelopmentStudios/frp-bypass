name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Fixed input name here

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Google Fastboot Binaries
      run: |
        Invoke-WebRequest -Uri "https://google.com" -OutFile "tools.zip"
        Expand-Archive -Path "tools.zip" -DestinationPath "platform-tools"
        Copy-Item "platform-tools\platform-tools\fastboot.exe" -Destination ".\fastboot.exe"
        Copy-Item "platform-tools\platform-tools\AdbWinApi.dll" -Destination ".\AdbWinApi.dll"

    - name: Compile Script to EXE via PyInstaller
      run: |
        pyinstaller --onefile --noconsole --add-data "fastboot.exe;." --add-data "AdbWinApi.dll;." main.py

    - name: Upload Finished EXE Application
      uses: actions/upload-artifact@v4
      with:
        name: Fastboot-FRP-Utility
        path: dist/main.exe
