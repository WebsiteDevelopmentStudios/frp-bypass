name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller Directly
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Download and Extract Google Fastboot Binaries
      run: |
        Invoke-WebRequest -Uri "https://google.com" -OutFile "tools.zip"
        Expand-Archive -Path "tools.zip" -DestinationPath "extracted_tools"
        Get-ChildItem -Path "extracted_tools" -Recurse -Filter "fastboot.exe" | Copy-Item -Destination ".\fastboot.exe"
        Get-ChildItem -Path "extracted_tools" -Recurse -Filter "AdbWinApi.dll" | Copy-Item -Destination ".\AdbWinApi.dll"

    - name: Compile Script to EXE via PyInstaller
      run: |
        # Removed --noconsole so the command terminal is visible to the user
        pyinstaller --onefile --add-data "fastboot.exe;." --add-data "AdbWinApi.dll;." main.py

    - name: Upload Finished EXE Application
      uses: actions/upload-artifact@v4
      with:
        name: Fastboot-FRP-Utility
        path: dist/main.exe
