name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller Directly
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Download Google Fastboot Safely
      uses: oszoo/download-file@v2
      with:
        url: 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip'
        file-name: 'tools.zip'

    - name: Extract Binaries and Move
      shell: cmd
      run: |
        :: Extract using native Windows tar
        tar -xf tools.zip
        
        :: Copy required binaries to root where main.py can find them
        copy platform-tools\fastboot.exe .\fastboot.exe
        copy platform-tools\AdbWinApi.dll .\AdbWinApi.dll

    - name: Compile Script to EXE via PyInstaller
      run: |
        pyinstaller --onefile --add-data "fastboot.exe;." --add-data "AdbWinApi.dll;." main.py

    - name: Upload Finished EXE Application
      uses: actions/upload-artifact@v4
      with:
        name: Fastboot-FRP-Utility
        path: dist/main.exe
